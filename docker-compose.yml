services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: examflow-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ExamFlow@123"

    ports:
      - "1434:1433"

    volumes:
      - examflow_sql_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "ExamFlow@123" -C -Q "SELECT 1" || exit 1'
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./Backend/ExamFlow.API
      dockerfile: Dockerfile

    container_name: examflow-api

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MSSQLConnectionString: "Server=sqlserver,1433;Database=ExamFlow;User Id=sa;Password=ExamFlow@123;TrustServerCertificate=True;"

    ports:
      - "8080:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile

    container_name: examflow-frontend

    ports:
      - "8081:80"

    depends_on:
      - api

volumes:
  examflow_sql_data: