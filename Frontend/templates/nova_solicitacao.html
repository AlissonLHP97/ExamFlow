<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ExamFlow | Nova Solicitação</title>

    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <div class="dashboard">

        <!-- MENU LATERAL -->
        <aside class="sidebar">

            <div class="sidebar-brand">
                <div class="brand-icon">E</div>
                <span>ExamFlow</span>
            </div>

            <nav class="sidebar-menu">

                <a href="medico.html" class="menu-item">
                    Dashboard
                </a>

                <a href="#" class="menu-item active">
                    Nova solicitação
                </a>

                <a href="#" class="menu-item">
                    Solicitações
                </a>

            </nav>

            <div class="sidebar-footer">
                Sistema de exames
            </div>

        </aside>


        <!-- CONTEÚDO -->
        <main class="main-content">

            <header class="topbar">

                <div>
                    <span class="page-label">SOLICITAÇÃO</span>
                    <h1>Nova solicitação de exame</h1>
                </div>

                <div class="doctor-profile">

                    <div class="doctor-avatar">
                        C
                    </div>

                    <div class="doctor-info">
                        <strong>Dr. Carlos Henrique</strong>
                        <span>Médico</span>
                    </div>

                </div>

            </header>


            <!-- FORMULÁRIO -->
            <section class="form-card">

                <div class="form-card-header">

                    <h2>Dados do exame</h2>

                    <p>
                        Preencha as informações para registrar
                        uma nova solicitação.
                    </p>

                </div>


                <form class="exam-form">

                    <div class="form-row">

                        <div class="form-field">

                            <label for="patient">
                                Paciente
                            </label>

                            <select id="patient" name="patient">

                                <option value="">
                                    Selecione o paciente
                                </option>

                                <option>
                                    Maria Oliveira
                                </option>

                                <option>
                                    João Santos
                                </option>

                                <option>
                                    Ana Costa
                                </option>

                            </select>

                        </div>


                        <div class="form-field">

                            <label for="exam">
                                Tipo de exame
                            </label>

                            <select id="exam" name="exam">

                                <option value="">
                                    Selecione o exame
                                </option>

                                <option>
                                    Hemograma completo
                                </option>

                                <option>
                                    Raio-X de tórax
                                </option>

                                <option>
                                    Ultrassonografia
                                </option>

                                <option>
                                    Tomografia
                                </option>

                            </select>

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-field">

                            <label for="date">
                                Data da solicitação
                            </label>

                            <input
                                type="date"
                                id="date"
                                name="date"
                            >

                        </div>

                    </div>


                    <div class="form-field">

                        <label for="observations">
                            Observações
                        </label>

                        <textarea
                            id="observations"
                            name="observations"
                            placeholder="Digite alguma observação importante sobre o exame..."
                        ></textarea>

                    </div>


                    <div class="form-actions">

                        <a href="medico.html" class="cancel-button">
                            Cancelar
                        </a>

                        <button
                            type="submit"
                            class="primary-button"
                        >
                            Enviar solicitação
                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

</body>

</html>
